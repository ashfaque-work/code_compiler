name: code-compiler

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DOCKER_SOCKET: /var/run/docker.sock
      # Must match the bind mount below on both sides. The runner creates
      # sibling containers, so this path is resolved by the Docker host.
      JOB_DIR_ROOT: /var/lib/code-compiler/jobs
      RUNNER_CONCURRENCY: "2"
    volumes:
      # Lets the runner create execution containers. This is the reason the
      # runner is a separate service from the API: the public-facing process
      # must never have a path to the daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/code-compiler/jobs:/var/lib/code-compiler/jobs
